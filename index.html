<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Affiliate</title>
  <style>
    :root {
      --bg: #f7f2e9;
      --surface: #ffffff;
      --text: #212121;
      --accent: #b67f52;
      --accent-alt: #e3b984;
      --secondary: #7f5d3b;
      --header: rgba(255,255,255,0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: all 0.5s ease;
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 100;
      background: var(--header);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .nav-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .nav-menu button {
      border: none;
      background: transparent;
      color: var(--secondary);
      cursor: pointer;
      padding: 0.7rem 0.95rem;
      border-radius: 999px;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .nav-menu button.active,
    .nav-menu button:hover {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .hero {
      display: grid;
      gap: 1.5rem;
      padding: 2rem 0;
    }

    .hero h1 {
      font-size: clamp(2.3rem, 5vw, 3.8rem);
      line-height: 1.05;
      margin-bottom: 1rem;
    }

    .hero p {
      max-width: 760px;
      font-size: 1rem;
      color: rgba(33, 33, 33, 0.78);
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 1.5rem;
    }

    .pill {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 999px;
      padding: 0.85rem 1rem;
      font-weight: 600;
      color: var(--secondary);
    }

    .theme-hint {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: rgba(33, 33, 33, 0.67);
    }

    .product-grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      margin-top: 2rem;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      transform: translateY(0);
      opacity: 1;
      transition: transform 0.45s ease, opacity 0.45s ease;
    }

    .product-card.hide {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .product-info h3 {
      font-size: 1.15rem;
      line-height: 1.35;
    }

    .product-info p {
      color: rgba(33, 33, 33, 0.72);
      min-height: 3.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.05);
      font-size: 0.85rem;
      color: var(--secondary);
      width: fit-content;
    }

    .cta {
      margin-top: auto;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .cta a {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 160px;
      padding: 0.95rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      background: var(--accent);
      color: #ffffff;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .cta a:hover {
      transform: translateY(-1px);
      background: var(--secondary);
    }

    footer {
      padding: 2rem 1.25rem;
      text-align: center;
      color: rgba(33, 33, 33, 0.6);
    }

    @media (max-width: 860px) {
      .hero {
        text-align: center;
      }

      .summary {
        justify-content: center;
      }
    }

    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        align-items: stretch;
      }

      .nav-menu {
        justify-content: center;
      }

      .hero {
        padding-top: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>

        <div class="mark">A</div>

        <button class="nav-item" data-category="Gia dụng">Gia dụng</button>
        <button class="nav-item" data-category="Công nghệ">Công nghệ</button>
        <button class="nav-item" data-category="Mỹ phẩm">Mỹ phẩm</button>
        <button class="nav-item" data-category="Gia đình">Gia đình</button>
        <button class="nav-item" data-category="Khám phá">Khám phá</button>

  </header>

  <main>

        <div class="theme-hint">Chủ đề thay đổi mượt khi chọn danh mục: Gia dụng, Công nghệ, Mỹ phẩm, Khám phá.</div>
      </div>
    </section>

    <section class="product-grid" id="productGrid"></section>
  </main>

  <footer>© 2026 AffiliateLab • Dữ liệu sản phẩm được quản lý bởi chủ sở hữu</footer>

  <script>

      Sau này có thể mở rộng thành products.json hoặc trang Admin Dashboard bảo mật.
    */

      {

        affiliate: 'https://shopee.vn/',
        shop: 'Shopee'
      },
      {
        id: 2,
        category: 'Công nghệ',
        title: 'Tai nghe Bluetooth chống ồn',
        description: 'Âm thanh sống động, pin lâu, phù hợp làm quà tặng và tăng click vào link affiliate.',
        image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80',
        affiliate: 'https://lazada.vn/',
        shop: 'Lazada'
      },
      {
        id: 3,
        category: 'Mỹ phẩm',
        title: 'Set chăm sóc da Glow',
        description: 'Bộ sản phẩm tone hồng thanh lịch, giúp khách hàng cảm thấy tin tưởng và dễ dàng ra quyết định.',
        image: 'https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=800&q=80',
        affiliate: 'https://shopee.vn/',
        shop: 'Shopee'
      },
      {
        id: 4,
        category: 'Gia dụng',
        title: 'Đèn ngủ thông minh cảm ứng',
        description: 'Ánh sáng ấm áp, thiết kế tinh tế cho phòng ngủ và phòng khách. Tối ưu chuyển đổi với thông điệp rõ ràng.',
        image: 'https://images.unsplash.com/photo-1519710164239-da123dc03ef4?auto=format&fit=crop&w=800&q=80',
        affiliate: 'https://lazada.vn/',
        shop: 'Lazada'
      },
      {
        id: 5,
        category: 'Công nghệ',
        title: 'Bàn phím cơ RGB cao cấp',
        description: 'Phong cách Cyberpunk, phản hồi nhanh, phù hợp người dùng chơi game và làm việc sáng tạo.',
        image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80',

        shop: 'Shopee'
      },
      {
        id: 6,
        category: 'Mỹ phẩm',
        title: 'Son môi lì sang trọng',
        description: 'Màu sắc tự nhiên, lâu trôi. Thiết kế đẳng cấp giúp tăng độ tin cậy cho trang affiliate.',
        image: 'https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=800&q=80',
        affiliate: 'https://lazada.vn/',
        shop: 'Lazada'
      },
      {
        id: 7,
        category: 'Khám phá',
        title: 'Fact thú vị về máy làm sữa hạt',
        description: 'Sản phẩm này thường được mua nhiều hơn trong mùa lạnh nhờ khả năng giữ nhiệt và dễ dàng vệ sinh.',
        image: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80',
        affiliate: 'https://shopee.vn/',
        shop: 'Shopee'
      },
      {
        id: 8,
        category: 'Khám phá',
        title: 'Bí quyết chọn máy lọc không khí',
        description: 'Chọn sản phẩm có bộ lọc HEPA và chỉ số CADR cao để đạt hiệu quả loại bỏ bụi mịn và mùi hôi.',
        image: 'https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=800&q=80',
        affiliate: 'https://lazada.vn/',
        shop: 'Lazada'
      }
    ];

    const themes = {
      'Tất cả': {
        '--bg': '#f7f2e9',
        '--surface': '#ffffff',
        '--text': '#212121',
        '--accent': '#b67f52',
        '--accent-alt': '#e3b984',
        '--secondary': '#7f5d3b',
        '--header': 'rgba(255,255,255,0.95)'
      },
      'Gia dụng': {
        '--bg': '#fff7eb',
        '--surface': '#ffffff',
        '--text': '#2f210a',
        '--accent': '#c48c55',
        '--accent-alt': '#f0d3b8',
        '--secondary': '#8b5f39',
        '--header': 'rgba(255,250,244,0.92)'
      },
      'Công nghệ': {
        '--bg': '#0c121c',
        '--surface': '#121926',
        '--text': '#e8f6ff',
        '--accent': '#4e9af1',
        '--accent-alt': '#1f72ff',
        '--secondary': '#7fd1ff',
        '--header': 'rgba(14,22,38,0.95)'
      },
      'Mỹ phẩm': {
        '--bg': '#fff2f8',
        '--surface': '#fffafa',
        '--text': '#3d1f2b',
        '--accent': '#d9749e',
        '--accent-alt': '#f3c1d6',
        '--secondary': '#8c4a6d',
        '--header': 'rgba(255,248,250,0.96)'
      },
      'Khám phá': {
        '--bg': '#f0f7ff',
        '--surface': '#ffffff',
        '--text': '#102a43',
        '--accent': '#4e9af1',
        '--accent-alt': '#a7d3ff',
        '--secondary': '#0b6fa4',
        '--header': 'rgba(240,247,255,0.95)'
      },
      'Gia đình': {
        '--bg': '#eef7f3',
        '--surface': '#ffffff',
        '--text': '#1f2f28',
        '--accent': '#4f8f7a',
        '--accent-alt': '#8cc5b2',
        '--secondary': '#376b55',
        '--header': 'rgba(248,252,250,0.95)'
      }
    };

    const productGrid = document.getElementById('productGrid');
    const navButtons = document.querySelectorAll('.nav-item');
    let currentCategory = 'Tất cả';

    function renderProducts(category) {
      const matching = category === 'Tất cả'
        ? products
        : products.filter(product => product.category === category);

      const newCards = matching.map(product => {
        const card = document.createElement('article');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${product.image}" alt="${product.title}">
          <div class="product-info">
            <span class="badge">${product.category}</span>
            <h3>${product.title}</h3>
            <p>${product.description}</p>
            <div class="cta">
              <a href="${product.affiliate}" target="_blank" rel="noopener noreferrer">Mua ngay tại ${product.shop}</a>
            </div>
          </div>`;
        return card;
      });

      const oldCards = Array.from(productGrid.children);
      oldCards.forEach(card => card.classList.add('hide'));
      setTimeout(() => {
        productGrid.innerHTML = '';
        newCards.forEach(card => productGrid.appendChild(card));
      }, 250);
    }

    function applyTheme(category) {
      const theme = themes[category] || themes['Tất cả'];
      Object.entries(theme).forEach(([name, value]) => {
        document.documentElement.style.setProperty(name, value);
      });
    }

    navButtons.forEach(button => {
      button.addEventListener('click', () => {
        if (button.dataset.category === currentCategory) return;
        navButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        currentCategory = button.dataset.category;
        applyTheme(currentCategory);
        renderProducts(currentCategory);
      });
    });

    renderProducts(currentCategory);
    applyTheme(currentCategory);
  </script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 1. Dán đoạn mã firebaseConfig bạn lấy được ở Bước 1 vào đây thay thế đoạn mẫu này:
  const firebaseConfig = {
    apiKey: "AIzaSyD0Af-ypRy771Dpm2hZ-uEvkGVSJIzc_48",
    authDomain: "nbm-26675.firebaseapp.com",
    databaseURL: "https://nbm-26675-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nbm-26675",
    storageBucket: "nbm-26675.firebasestorage.app",
    messagingSenderId: "1072961542986",
    appId: "1:1072961542986:web:6dfd6b8638078a058ebfb3",
  };

  // 2. Khởi tạo Firebase vào Landing Page
  firebase.initializeApp(firebaseConfig);

  // 3. Khai báo biến cơ sở dữ liệu để sẵn sàng sử dụng trong code giao diện
  const database = firebase.database();
  // Hàm tạo tài khoản mới (Chỉ cần Tên và Mật khẩu)
function dangKyTaiKhoan(tenUser, matKhau) {
  // Kiểm tra xem tên tài khoản đã tồn tại trên Firebase chưa
  database.ref('users/' + tenUser).once('value').then((snapshot) => {
    if (snapshot.exists()) {
      alert("Tên tài khoản này đã có người sử dụng!");
    } else {
      // Nếu chưa có, tiến hành lưu mật khẩu và giỏ hàng trống lên database
      database.ref('users/' + tenUser).set({
        password: matKhau,
        cart: []
      }).then(() => {
        alert("Đăng ký tài khoản thành công!");
      });
    }
  });
}
  console.log("Firebase kết nối thành công!");
  // Hàm lưu danh sách sản phẩm muốn mua của người dùng lên dữ liệu đám mây
function capNhatGioHang(tenUser, danhSachSanPham) {
  database.ref('users/' + tenUser + '/cart').set(danhSachSanPham)
    .then(() => {
      console.log("Giỏ hàng đã được đồng bộ lên Firebase!");
    })
    .catch((error) => {
      console.error("Lỗi đồng bộ giỏ hàng:", error);
    });
}
</script>
